<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" aria-label="Cartographic Vector Map of Medininagar / Daltonganj Dark Theme (PIN: 822101)">
  <title>Medininagar (Daltonganj) Vector Map - Dark Theme</title>
  <desc>Detailed cartographic offline dark mode map of Medininagar showing North Koel River, DTO Railway Station, NH-39, and District Administrative Hub.</desc>

  <defs>
    <!-- Background Gradient & Patterns -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100C1A"/>
      <stop offset="100%" stop-color="#0A0711"/>
    </linearGradient>

    <linearGradient id="river-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="highway-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <pattern id="dark-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#221A33" stroke-width="0.7" opacity="0.65"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badge-shadow-dark" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="pin-glow-dark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF4D6D" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .road-minor-dark { stroke: #1D152C; stroke-width: 2; fill: none; stroke-linecap: round; }
    .road-secondary-dark { stroke: #2D2340; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .road-primary-dark { stroke: #3D3055; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .highway-casing-dark { stroke: #3D3055; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .highway-core-dark { stroke: url(#highway-grad-dark); stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .river-body-dark { stroke: url(#river-grad-dark); stroke-width: 38; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .river-core-dark { stroke: #38BDF8; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.45; }
    .park-dark { fill: #102A20; stroke: #059669; stroke-width: 1; stroke-opacity: 0.35; }
    .admin-zone-dark { fill: #261D12; stroke: #D97706; stroke-width: 1; stroke-opacity: 0.4; }
    .urban-block-dark { fill: #161024; stroke: #261B38; stroke-width: 1; }
    .railway-line-dark { stroke: #94A3B8; stroke-width: 2.5; stroke-dasharray: 6 6; fill: none; }
    .railway-base-dark { stroke: #334155; stroke-width: 5; fill: none; }
    .label-primary-dark { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F5F2F8; }
    .label-secondary-dark { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #A1A1AA; }
    .badge-bg-dark { fill: #181226; stroke: #2D2340; stroke-width: 1; }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1000" height="650" fill="url(#bg-grad-dark)"/>
  <rect width="1000" height="650" fill="url(#dark-grid)"/>

  <!-- Urban Neighborhood Polygons / Districts -->
  <g id="neighborhoods-dark" opacity="0.9">
    <!-- Shahpur (West Bank) -->
    <path class="urban-block-dark" d="M 30,180 L 140,160 L 160,260 L 90,340 L 20,310 Z"/>
    <path class="urban-block-dark" d="M 30,360 L 120,380 L 140,510 L 40,540 Z"/>
    
    <!-- Redma & Belwatika (East / Northeast) -->
    <path class="urban-block-dark" d="M 540,60 L 720,40 L 780,140 L 630,170 L 530,120 Z"/>
    <path class="urban-block-dark" d="M 680,180 L 860,150 L 920,270 L 760,280 Z"/>

    <!-- Central Business & Market (Sudna, Six Muhani, Kund) -->
    <path class="urban-block-dark" d="M 440,240 L 570,220 L 590,300 L 470,320 Z"/>
    <path class="urban-block-dark" d="M 480,340 L 610,320 L 630,420 L 500,430 Z"/>
    <path class="urban-block-dark" d="M 360,330 L 450,320 L 440,430 L 340,410 Z"/>

    <!-- Hamidganj & Housing Colony (South) -->
    <path class="urban-block-dark" d="M 520,460 L 660,440 L 700,560 L 560,580 Z"/>
    <path class="urban-block-dark" d="M 380,470 L 490,460 L 480,590 L 360,570 Z"/>

    <!-- Railway Colony (East) -->
    <path class="urban-block-dark" d="M 680,310 L 820,300 L 850,440 L 710,430 Z"/>
    <path class="urban-block-dark" d="M 730,460 L 880,450 L 910,570 L 760,580 Z"/>
  </g>

  <!-- Green Spaces & Reserves (Dark Emerald) -->
  <g id="parks-dark">
    <!-- North Koel Riparian Reserve Green Belt -->
    <path class="park-dark" d="M 120,40 C 140,90 170,160 150,230 C 130,290 80,330 90,380 C 100,420 120,470 110,530 C 90,490 80,430 70,370 C 60,300 80,240 90,170 Z"/>
    <!-- Shivaji Maidan Sports Area -->
    <path class="park-dark" d="M 380,360 L 440,355 L 435,405 L 375,410 Z" rx="6"/>
    <!-- Circuit House / Forest Enclave -->
    <path class="park-dark" d="M 320,160 C 350,150 400,160 410,210 C 380,220 330,210 320,160 Z"/>
    <!-- Palamu Forest Fringe (East outskirts) -->
    <path class="park-dark" d="M 880,50 C 940,40 980,80 970,140 C 920,160 880,110 880,50 Z"/>
  </g>

  <!-- Administrative Zone (Collectorate / Court) -->
  <g id="administrative-hub-dark">
    <path class="admin-zone-dark" d="M 390,140 L 490,130 L 510,210 L 410,220 Z" rx="4"/>
  </g>

  <!-- North Koel River System (Deep Luminous Blue) -->
  <g id="river-system-dark">
    <!-- North Koel Main Stream -->
    <path class="river-body-dark" d="M 130,660 C 160,580 190,490 205,420 C 220,350 235,270 215,190 C 195,110 165,60 145,-10"/>
    <path class="river-core-dark" d="M 130,660 C 160,580 190,490 205,420 C 220,350 235,270 215,190 C 195,110 165,60 145,-10"/>
    
    <!-- River Channel Sandbars -->
    <ellipse cx="195" cy="410" rx="6" ry="28" fill="#152138" opacity="0.9" transform="rotate(-15 195 410)"/>
    <ellipse cx="220" cy="240" rx="5" ry="20" fill="#152138" opacity="0.9" transform="rotate(10 220 240)"/>

    <!-- River Water Ripples -->
    <path d="M 145,610 C 170,540 195,470 206,410" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 16" fill="none" opacity="0.6"/>
    <path d="M 218,330 C 225,280 220,230 205,170" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 18" fill="none" opacity="0.6"/>
  </g>

  <!-- Minor Urban Road Grid -->
  <g id="minor-streets-dark">
    <!-- Shahpur Internal Grid -->
    <line x1="40" y1="210" x2="140" y2="210" class="road-minor-dark"/>
    <line x1="40" y1="260" x2="150" y2="260" class="road-minor-dark"/>
    <line x1="90" y1="170" x2="90" y2="310" class="road-minor-dark"/>
    
    <!-- Sudna / Redma Grid -->
    <line x1="560" y1="70" x2="720" y2="70" class="road-minor-dark"/>
    <line x1="570" y1="120" x2="740" y2="120" class="road-minor-dark"/>
    <line x1="620" y1="40" x2="620" y2="160" class="road-minor-dark"/>
    <line x1="680" y1="40" x2="680" y2="160" class="road-minor-dark"/>

    <!-- City Center Grid (Six Muhani, Kund, Hospital vicinity) -->
    <line x1="450" y1="260" x2="570" y2="260" class="road-minor-dark"/>
    <line x1="450" y1="290" x2="580" y2="290" class="road-minor-dark"/>
    <line x1="480" y1="360" x2="610" y2="360" class="road-minor-dark"/>
    <line x1="480" y1="390" x2="610" y2="390" class="road-minor-dark"/>
    <line x1="500" y1="230" x2="500" y2="420" class="road-minor-dark"/>
    <line x1="550" y1="230" x2="550" y2="420" class="road-minor-dark"/>

    <!-- Hamidganj & South Extent Grid -->
    <line x1="390" y1="500" x2="480" y2="500" class="road-minor-dark"/>
    <line x1="390" y1="540" x2="480" y2="540" class="road-minor-dark"/>
    <line x1="540" y1="490" x2="670" y2="490" class="road-minor-dark"/>
    <line x1="540" y1="530" x2="670" y2="530" class="road-minor-dark"/>
  </g>

  <!-- Secondary Thoroughfares -->
  <g id="secondary-roads-dark">
    <!-- Redma - Belwatika Artery -->
    <path class="road-secondary-dark" d="M 520,120 C 600,140 700,160 840,160"/>
    <!-- Court Road linking Administrative Hub to Center -->
    <path class="road-secondary-dark" d="M 450,135 C 460,200 480,260 520,320"/>
    <!-- Station Access Boulevard -->
    <path class="road-secondary-dark" d="M 520,320 C 560,335 600,345 640,360"/>
    <!-- Sadar Hospital Road -->
    <path class="road-secondary-dark" d="M 520,320 C 540,370 560,410 580,450"/>
    <!-- Shahpur River Bridge Connecting Road -->
    <path class="road-secondary-dark" d="M 90,330 L 220,330"/>
    <path class="road-secondary-dark" d="M 220,330 C 310,330 420,325 520,320"/>
    <!-- Bypass Southern Connector -->
    <path class="road-secondary-dark" d="M 330,570 C 420,560 540,570 730,550"/>
  </g>

  <!-- Primary Arteries & NH-39 Highway Corridor -->
  <g id="primary-highways-dark">
    <!-- NH-39 Casing -->
    <path class="highway-casing-dark" d="M 10,90 C 80,105 150,120 220,135 C 310,155 400,200 470,250 C 530,295 620,360 740,420 C 830,465 920,510 1000,535"/>
    <!-- NH-39 Radiant Glowing Line -->
    <path class="highway-core-dark" filter="url(#neon-glow)" d="M 10,90 C 80,105 150,120 220,135 C 310,155 400,200 470,250 C 530,295 620,360 740,420 C 830,465 920,510 1000,535"/>

    <!-- Ring Bypass Artery -->
    <path class="road-primary-dark" d="M 220,135 C 240,240 270,360 330,470 C 390,560 560,620 740,610 C 840,600 930,570 1000,535"/>
  </g>

  <!-- Bridges Across North Koel River -->
  <g id="river-bridges-dark">
    <!-- Shahpur Road Bridge (Central) -->
    <rect x="180" y="325" width="48" height="10" rx="2" fill="#1F2937" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="180" y1="330" x2="228" y2="330" stroke="#FF4D6D" stroke-width="3"/>
    
    <!-- NH-39 Bypass Koel Bridge (North) -->
    <rect x="190" y="127" width="46" height="12" rx="2" fill="#1F2937" stroke="#4B5563" stroke-width="1.5"/>
    <line x1="190" y1="133" x2="236" y2="133" stroke="#F97316" stroke-width="3.5"/>
  </g>

  <!-- Railway Corridor (East Central Railway / DTO) -->
  <g id="railway-dark">
    <path class="railway-base-dark" d="M 850,660 C 780,540 700,430 640,360 C 580,290 510,210 420,130 C 360,80 270,40 180,0"/>
    <path class="railway-line-dark" d="M 850,660 C 780,540 700,430 640,360 C 580,290 510,210 420,130 C 360,80 270,40 180,0"/>

    <!-- DTO Station Facility -->
    <g transform="translate(640, 360)">
      <rect x="-8" y="-22" width="22" height="44" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <rect x="18" y="-20" width="8" height="40" rx="2" fill="#64748B"/>
      <!-- Track Switch Indicators -->
      <line x1="-12" y1="-14" x2="-2" y2="-14" stroke="#60A5FA" stroke-width="1.5"/>
      <line x1="-12" y1="14" x2="-2" y2="14" stroke="#60A5FA" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Landmark Points of Interest & Neon Tags -->
  <g id="landmarks-dark">
    <!-- Medininagar Railway Station [DTO] Badge -->
    <g transform="translate(670, 355)" filter="url(#badge-shadow-dark)">
      <rect class="badge-bg-dark" x="0" y="-14" width="140" height="28" rx="14"/>
      <circle cx="14" cy="0" r="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
      <!-- Train Glyph -->
      <path d="M 11,-4 L 17,-4 L 17,2 L 11,2 Z M 11,3 L 13,3 M 15,3 L 17,3" stroke="#93C5FD" stroke-width="1" fill="none"/>
      <text x="28" y="4" class="label-primary-dark" font-size="11">DTO Station</text>
      <text x="96" y="4" class="label-secondary-dark" font-size="9">(822101)</text>
    </g>

    <!-- Administrative Hub / Collectorate Badge -->
    <g transform="translate(425, 125)" filter="url(#badge-shadow-dark)">
      <rect class="badge-bg-dark" x="-10" y="-12" width="160" height="26" rx="13"/>
      <circle cx="2" cy="1" r="7" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
      <polygon points="2,-3 -2,3 6,3" fill="#FBBF24"/>
      <text x="16" y="5" class="label-primary-dark" font-size="10.5">Palamu Admin Hub</text>
    </g>

    <!-- Sadar Hospital Marker -->
    <g transform="translate(595, 455)" filter="url(#badge-shadow-dark)">
      <rect class="badge-bg-dark" x="0" y="-11" width="105" height="22" rx="11"/>
      <circle cx="11" cy="0" r="6" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
      <path d="M 8,0 L 14,0 M 11,-3 L 11,3" stroke="#F87171" stroke-width="1.5"/>
      <text x="22" y="4" class="label-secondary-dark" font-weight="700" font-size="9.5">Sadar Hospital</text>
    </g>

    <!-- Shivaji Maidan Arena -->
    <g transform="translate(345, 415)" filter="url(#badge-shadow-dark)">
      <rect class="badge-bg-dark" x="0" y="-10" width="100" height="20" rx="10"/>
      <circle cx="10" cy="0" r="5" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <text x="20" y="4" class="label-secondary-dark" font-weight="700" font-size="9">Shivaji Maidan</text>
    </g>

    <!-- NH-39 Highway Emblem -->
    <g transform="translate(770, 435)" filter="url(#badge-shadow-dark)">
      <rect x="0" y="-12" width="56" height="24" rx="6" fill="#EA580C" stroke="#F97316" stroke-width="1.5"/>
      <text x="28" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">NH-39</text>
    </g>

    <!-- North Koel River Watermark Glow -->
    <text x="180" y="500" transform="rotate(-70 180 500)" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60A5FA" opacity="0.65" letter-spacing="3">NORTH KOEL RIVER</text>

    <!-- Shahpur Heritage West Bank -->
    <g transform="translate(70, 310)" filter="url(#badge-shadow-dark)">
      <rect class="badge-bg-dark" x="0" y="-10" width="82" height="20" rx="10"/>
      <text x="41" y="4" text-anchor="middle" class="label-secondary-dark" font-weight="600" font-size="9.5">Shahpur West</text>
    </g>
  </g>

  <!-- Central Pulse Location Marker Pin (Medininagar Center) -->
  <g id="center-pulse-marker-dark" transform="translate(520, 320)">
    <!-- Animated Expanding Neon Pulse Rings -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FF4D6D" stroke-width="2.5" opacity="0.85">
      <animate attributeName="r" values="8;45" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="3.5;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="22" fill="#FF4D6D" opacity="0.15">
      <animate attributeName="r" values="14;34" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="10" fill="#3B1124" stroke="#FF4D6D" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#FF4D6D" filter="url(#neon-glow)"/>
    
    <!-- Central Pin Stem & Glow -->
    <g transform="translate(0, -10)" filter="url(#pin-glow-dark)">
      <path d="M 0,-34 C -16,-34 -24,-20 0,0 C 24,-20 16,-34 0,-34 Z" fill="#FF4D6D"/>
      <circle cx="0" cy="-20" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Center Callout Pill -->
    <g transform="translate(24, -40)" filter="url(#badge-shadow-dark)">
      <rect x="0" y="-12" width="146" height="34" rx="8" fill="#181226" stroke="#FF4D6D" stroke-width="1.2"/>
      <circle cx="12" cy="5" r="4" fill="#FF4D6D" filter="url(#neon-glow)"/>
      <text x="22" y="1" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">MEDININAGAR HQ</text>
      <text x="22" y="14" font-family="system-ui, monospace" font-size="8.5" font-weight="600" fill="#FF758F">PIN: 822101 &bull; JHARKHAND</text>
    </g>
  </g>

  <!-- HUD Overlay: Compass Rose & Coordinate Metadata Badge -->
  <g id="hud-elements-dark">
    <!-- Compass Rose (Top Right) -->
    <g transform="translate(940, 60)" filter="url(#badge-shadow-dark)">
      <circle cx="0" cy="0" r="24" fill="#181226" stroke="#2D2340" stroke-width="1.5"/>
      <!-- North Pointer (Bright Red/Magenta) -->
      <polygon points="0,-19 5,-3 0,0" fill="#FF4D6D"/>
      <!-- South Pointer (Slate) -->
      <polygon points="0,19 5,3 0,0" fill="#475569"/>
      <!-- West/East Pointers -->
      <polygon points="0,0 -3,-5 -19,0" fill="#334155"/>
      <polygon points="0,0 3,-5 19,0" fill="#334155"/>
      <polygon points="0,-19 -5,-3 0,0" fill="#E11D48"/>
      <polygon points="0,19 -5,3 0,0" fill="#1E293B"/>
      <!-- Cardinal Letter N -->
      <text x="0" y="-23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FF4D6D">N</text>
    </g>

    <!-- Coordinates Badge (Bottom Left) -->
    <g transform="translate(30, 605)" filter="url(#badge-shadow-dark)">
      <rect class="badge-bg-dark" x="0" y="-18" width="225" height="36" rx="10"/>
      <!-- Glowing Target Dot -->
      <circle cx="18" cy="0" r="7" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="18" cy="0" r="2.5" fill="#60A5FA"/>
      <text x="34" y="-3" font-family="system-ui, monospace" font-size="10" font-weight="700" fill="#F5F2F8">24.0416° N, 84.0700° E</text>
      <text x="34" y="9" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#A1A1AA">MEDININAGAR (DALTONGANJ)</text>
    </g>

    <!-- Graphic Scale Bar (Bottom Right) -->
    <g transform="translate(800, 615)" filter="url(#badge-shadow-dark)">
      <rect class="badge-bg-dark" x="-10" y="-18" width="175" height="28" rx="8"/>
      <line x1="10" y1="0" x2="150" y2="0" stroke="#F5F2F8" stroke-width="2"/>
      <line x1="10" y1="-4" x2="10" y2="4" stroke="#F5F2F8" stroke-width="2"/>
      <line x1="80" y1="-3" x2="80" y2="3" stroke="#F5F2F8" stroke-width="1.5"/>
      <line x1="150" y1="-4" x2="150" y2="4" stroke="#F5F2F8" stroke-width="2"/>
      <text x="10" y="-6" text-anchor="middle" font-family="system-ui, monospace" font-size="8" font-weight="700" fill="#A1A1AA">0</text>
      <text x="80" y="-6" text-anchor="middle" font-family="system-ui, monospace" font-size="8" font-weight="700" fill="#A1A1AA">1 km</text>
      <text x="150" y="-6" text-anchor="middle" font-family="system-ui, monospace" font-size="8" font-weight="700" fill="#A1A1AA">2 km</text>
    </g>
  </g>

  <!-- Technical Corner Marks -->
  <g stroke="#3D3055" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 12 24 L 12 12 L 24 12"/>
    <path d="M 988 24 L 988 12 L 976 12"/>
    <path d="M 12 626 L 12 638 L 24 638"/>
    <path d="M 988 626 L 988 638 L 976 638"/>
  </g>
</svg>
