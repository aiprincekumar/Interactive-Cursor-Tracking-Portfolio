<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" aria-label="Cartographic Vector Map of Medininagar / Daltonganj (PIN: 822101)">
  <title>Medininagar (Daltonganj) Vector Map - Light Theme</title>
  <desc>Detailed cartographic offline map of Medininagar showing North Koel River, DTO Railway Station, NH-39, and District Administrative Hub.</desc>

  <defs>
    <!-- Background Gradient & Patterns -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>

    <linearGradient id="river-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <pattern id="light-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E7E2D8" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <!-- Rail Pattern -->
    <pattern id="rail-ties-light" width="10" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="3" x2="10" y2="3" stroke="#64748B" stroke-width="2"/>
    </pattern>

    <!-- Shadow Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="pin-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF4D6D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .road-minor { stroke: #EDE8DE; stroke-width: 2; fill: none; stroke-linecap: round; }
    .road-secondary { stroke: #DCD5C7; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .road-primary { stroke: #C8BFAD; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .highway-core { stroke: #FB923C; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .highway-casing { stroke: #E2D9C8; stroke-width: 7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .river-body { stroke: url(#river-grad-light); stroke-width: 38; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .river-core { stroke: #60A5FA; stroke-width: 14; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.5; }
    .park { fill: #DCFCE7; stroke: #BBF7D0; stroke-width: 1.5; }
    .admin-zone { fill: #FEF3C7; stroke: #FDE68A; stroke-width: 1.5; }
    .urban-block { fill: #F3EFE7; stroke: #E5DFD3; stroke-width: 1; }
    .railway-line { stroke: #475569; stroke-width: 3; stroke-dasharray: 6 6; fill: none; }
    .railway-base { stroke: #94A3B8; stroke-width: 5; fill: none; }
    .label-primary { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #18181B; }
    .label-secondary { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #71717A; }
    .badge-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
    .pulse-ring { animation: pulseAnim 2.5s cubic-bezier(0.24, 0, 0.38, 1) infinite; transform-origin: 520px 320px; }
    @keyframes pulseAnim {
      0% { r: 6px; opacity: 0.9; }
      50% { opacity: 0.4; }
      100% { r: 32px; opacity: 0; }
    }
  </style>

  <!-- Base Landmass -->
  <rect width="1000" height="650" fill="url(#bg-grad-light)"/>
  <rect width="1000" height="650" fill="url(#light-grid)"/>

  <!-- Urban Neighborhood Polygons / Districts -->
  <g id="neighborhoods" opacity="0.85">
    <!-- Shahpur (West Bank) -->
    <path class="urban-block" d="M 30,180 L 140,160 L 160,260 L 90,340 L 20,310 Z"/>
    <path class="urban-block" d="M 30,360 L 120,380 L 140,510 L 40,540 Z"/>
    
    <!-- Redma & Belwatika (East / Northeast) -->
    <path class="urban-block" d="M 540,60 L 720,40 L 780,140 L 630,170 L 530,120 Z"/>
    <path class="urban-block" d="M 680,180 L 860,150 L 920,270 L 760,280 Z"/>

    <!-- Central Business & Market (Sudna, Six Muhani, Kund) -->
    <path class="urban-block" d="M 440,240 L 570,220 L 590,300 L 470,320 Z"/>
    <path class="urban-block" d="M 480,340 L 610,320 L 630,420 L 500,430 Z"/>
    <path class="urban-block" d="M 360,330 L 450,320 L 440,430 L 340,410 Z"/>

    <!-- Hamidganj & Housing Colony (South) -->
    <path class="urban-block" d="M 520,460 L 660,440 L 700,560 L 560,580 Z"/>
    <path class="urban-block" d="M 380,470 L 490,460 L 480,590 L 360,570 Z"/>

    <!-- Railway Colony (East) -->
    <path class="urban-block" d="M 680,310 L 820,300 L 850,440 L 710,430 Z"/>
    <path class="urban-block" d="M 730,460 L 880,450 L 910,570 L 760,580 Z"/>
  </g>

  <!-- Green Spaces & Parks -->
  <g id="parks-and-nature">
    <!-- North Koel Riparian Reserve Green Belt -->
    <path class="park" d="M 120,40 C 140,90 170,160 150,230 C 130,290 80,330 90,380 C 100,420 120,470 110,530 C 90,490 80,430 70,370 C 60,300 80,240 90,170 Z"/>
    <!-- Shivaji Maidan Sports Area -->
    <path class="park" d="M 380,360 L 440,355 L 435,405 L 375,410 Z" rx="6"/>
    <!-- Circuit House / Forest Enclave -->
    <path class="park" d="M 320,160 C 350,150 400,160 410,210 C 380,220 330,210 320,160 Z"/>
    <!-- Palamu Forest Fringe (East outskirts) -->
    <path class="park" d="M 880,50 C 940,40 980,80 970,140 C 920,160 880,110 880,50 Z"/>
  </g>

  <!-- Administrative Zone (Collectorate / Court) -->
  <g id="administrative-hub">
    <path class="admin-zone" d="M 390,140 L 490,130 L 510,210 L 410,220 Z" rx="4"/>
  </g>

  <!-- North Koel River Network -->
  <g id="river-system">
    <!-- North Koel Main Course -->
    <path id="river-path" class="river-body" d="M 130,660 C 160,580 190,490 205,420 C 220,350 235,270 215,190 C 195,110 165,60 145,-10"/>
    <path class="river-core" d="M 130,660 C 160,580 190,490 205,420 C 220,350 235,270 215,190 C 195,110 165,60 145,-10"/>
    
    <!-- River Channel Sandbars -->
    <ellipse cx="195" cy="410" rx="6" ry="28" fill="#FAF8F5" opacity="0.8" transform="rotate(-15 195 410)"/>
    <ellipse cx="220" cy="240" rx="5" ry="20" fill="#FAF8F5" opacity="0.8" transform="rotate(10 220 240)"/>

    <!-- River Water Stream Texture Lines -->
    <path d="M 145,610 C 170,540 195,470 206,410" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 14" fill="none" opacity="0.7"/>
    <path d="M 218,330 C 225,280 220,230 205,170" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="10 16" fill="none" opacity="0.7"/>
  </g>

  <!-- Minor Urban Road Grid -->
  <g id="minor-streets">
    <!-- Shahpur Internal Grid -->
    <line x1="40" y1="210" x2="140" y2="210" class="road-minor"/>
    <line x1="40" y1="260" x2="150" y2="260" class="road-minor"/>
    <line x1="90" y1="170" x2="90" y2="310" class="road-minor"/>
    
    <!-- Sudna / Redma Grid -->
    <line x1="560" y1="70" x2="720" y2="70" class="road-minor"/>
    <line x1="570" y1="120" x2="740" y2="120" class="road-minor"/>
    <line x1="620" y1="40" x2="620" y2="160" class="road-minor"/>
    <line x1="680" y1="40" x2="680" y2="160" class="road-minor"/>

    <!-- City Center Grid (Six Muhani, Kund, Hospital vicinity) -->
    <line x1="450" y1="260" x2="570" y2="260" class="road-minor"/>
    <line x1="450" y1="290" x2="580" y2="290" class="road-minor"/>
    <line x1="480" y1="360" x2="610" y2="360" class="road-minor"/>
    <line x1="480" y1="390" x2="610" y2="390" class="road-minor"/>
    <line x1="500" y1="230" x2="500" y2="420" class="road-minor"/>
    <line x1="550" y1="230" x2="550" y2="420" class="road-minor"/>

    <!-- Hamidganj & South Extent Grid -->
    <line x1="390" y1="500" x2="480" y2="500" class="road-minor"/>
    <line x1="390" y1="540" x2="480" y2="540" class="road-minor"/>
    <line x1="540" y1="490" x2="670" y2="490" class="road-minor"/>
    <line x1="540" y1="530" x2="670" y2="530" class="road-minor"/>
  </g>

  <!-- Secondary Thoroughfares -->
  <g id="secondary-roads">
    <!-- Redma - Belwatika Artery -->
    <path class="road-secondary" d="M 520,120 C 600,140 700,160 840,160"/>
    <!-- Court Road linking Administrative Hub to Center -->
    <path class="road-secondary" d="M 450,135 C 460,200 480,260 520,320"/>
    <!-- Station Access Boulevard -->
    <path class="road-secondary" d="M 520,320 C 560,335 600,345 640,360"/>
    <!-- Sadar Hospital Road -->
    <path class="road-secondary" d="M 520,320 C 540,370 560,410 580,450"/>
    <!-- Shahpur River Bridge Connecting Road -->
    <path class="road-secondary" d="M 90,330 L 220,330"/>
    <path class="road-secondary" d="M 220,330 C 310,330 420,325 520,320"/>
    <!-- Bypass Southern Connector -->
    <path class="road-secondary" d="M 330,570 C 420,560 540,570 730,550"/>
  </g>

  <!-- Primary Arteries & NH-39 -->
  <g id="primary-highways">
    <!-- NH-39 Casing -->
    <path class="highway-casing" d="M 10,90 C 80,105 150,120 220,135 C 310,155 400,200 470,250 C 530,295 620,360 740,420 C 830,465 920,510 1000,535"/>
    <!-- NH-39 Glowing Core Line -->
    <path class="highway-core" d="M 10,90 C 80,105 150,120 220,135 C 310,155 400,200 470,250 C 530,295 620,360 740,420 C 830,465 920,510 1000,535"/>

    <!-- Ring Bypass Artery (Medininagar Outer Bypass) -->
    <path class="road-primary" d="M 220,135 C 240,240 270,360 330,470 C 390,560 560,620 740,610 C 840,600 930,570 1000,535"/>
  </g>

  <!-- Bridges Across North Koel River -->
  <g id="river-bridges">
    <!-- Shahpur Road Bridge (Central) -->
    <rect x="180" y="325" width="48" height="10" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <line x1="180" y1="330" x2="228" y2="330" stroke="#FB923C" stroke-width="3"/>
    
    <!-- NH-39 Bypass Koel Bridge (North) -->
    <rect x="190" y="127" width="46" height="12" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <line x1="190" y1="133" x2="236" y2="133" stroke="#FB923C" stroke-width="4"/>
  </g>

  <!-- Railway System (East Central Railway / DTO Corridor) -->
  <g id="railway">
    <!-- Rail Bed & Track Line -->
    <path class="railway-base" d="M 850,660 C 780,540 700,430 640,360 C 580,290 510,210 420,130 C 360,80 270,40 180,0"/>
    <path class="railway-line" d="M 850,660 C 780,540 700,430 640,360 C 580,290 510,210 420,130 C 360,80 270,40 180,0"/>

    <!-- DTO Railway Station Platform & Facility -->
    <g transform="translate(640, 360)">
      <rect x="-8" y="-22" width="22" height="44" rx="3" fill="#475569" stroke="#334155" stroke-width="1.5"/>
      <rect x="18" y="-20" width="8" height="40" rx="2" fill="#94A3B8"/>
      <!-- Small Track Switch Marks -->
      <line x1="-12" y1="-14" x2="-2" y2="-14" stroke="#475569" stroke-width="1.5"/>
      <line x1="-12" y1="14" x2="-2" y2="14" stroke="#475569" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Landmark Points of Interest & Badges -->
  <g id="landmarks">
    <!-- Medininagar Railway Station [DTO] Badge -->
    <g transform="translate(670, 355)" filter="url(#soft-shadow)">
      <rect class="badge-bg" x="0" y="-14" width="138" height="28" rx="14"/>
      <circle cx="14" cy="0" r="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <!-- Train Icon -->
      <path d="M 11,-4 L 17,-4 L 17,2 L 11,2 Z M 11,3 L 13,3 M 15,3 L 17,3" stroke="#2563EB" stroke-width="1" fill="none"/>
      <text x="28" y="4" class="label-primary" font-size="11">DTO Station</text>
      <text x="96" y="4" class="label-secondary" font-size="9">(822101)</text>
    </g>

    <!-- Administrative Hub / Collectorate Badge -->
    <g transform="translate(425, 125)" filter="url(#soft-shadow)">
      <rect class="badge-bg" x="-10" y="-12" width="160" height="26" rx="13"/>
      <circle cx="2" cy="1" r="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
      <polygon points="2,-3 -2,3 6,3" fill="#B45309"/>
      <text x="16" y="5" class="label-primary" font-size="10.5">Palamu Admin Hub</text>
    </g>

    <!-- Sadar Hospital Marker -->
    <g transform="translate(595, 455)" filter="url(#soft-shadow)">
      <rect class="badge-bg" x="0" y="-11" width="105" height="22" rx="11"/>
      <circle cx="11" cy="0" r="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
      <path d="M 8,0 L 14,0 M 11,-3 L 11,3" stroke="#DC2626" stroke-width="1.5"/>
      <text x="22" y="4" class="label-secondary" font-weight="700" font-size="9.5">Sadar Hospital</text>
    </g>

    <!-- Shivaji Maidan Sports Arena -->
    <g transform="translate(345, 415)" filter="url(#soft-shadow)">
      <rect class="badge-bg" x="0" y="-10" width="98" height="20" rx="10"/>
      <circle cx="10" cy="0" r="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1"/>
      <text x="20" y="4" class="label-secondary" font-weight="700" font-size="9">Shivaji Maidan</text>
    </g>

    <!-- NH-39 Route Shield Badge -->
    <g transform="translate(770, 435)" filter="url(#soft-shadow)">
      <rect x="0" y="-12" width="56" height="24" rx="6" fill="#FB923C" stroke="#EA580C" stroke-width="1"/>
      <text x="28" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">NH-39</text>
    </g>

    <!-- North Koel River Curved Watermark Text -->
    <text x="180" y="500" transform="rotate(-70 180 500)" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563EB" opacity="0.6" letter-spacing="3">NORTH KOEL RIVER</text>

    <!-- Shahpur Heritage West Bank -->
    <g transform="translate(70, 310)" filter="url(#soft-shadow)">
      <rect class="badge-bg" x="0" y="-10" width="80" height="20" rx="10"/>
      <text x="40" y="4" text-anchor="middle" class="label-secondary" font-weight="600" font-size="9.5">Shahpur West</text>
    </g>
  </g>

  <!-- Medininagar City Center Pulsing Location Marker Pin -->
  <g id="center-pulse-marker" transform="translate(520, 320)">
    <!-- Animated Expanding Pulse Rings -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#FF4D6D" stroke-width="2.5" opacity="0.8">
      <animate attributeName="r" values="8;42" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="3;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="20" fill="#FF4D6D" opacity="0.12">
      <animate attributeName="r" values="14;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.05" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="9" fill="#FFF0F3" stroke="#FF4D6D" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#FF4D6D"/>
    
    <!-- Central Pin Stem & Callout Tooltip -->
    <g transform="translate(0, -10)" filter="url(#pin-shadow)">
      <path d="M 0,-34 C -16,-34 -24,-20 0,0 C 24,-20 16,-34 0,-34 Z" fill="#FF4D6D"/>
      <circle cx="0" cy="-20" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Center Callout Pill -->
    <g transform="translate(24, -40)" filter="url(#soft-shadow)">
      <rect x="0" y="-12" width="146" height="34" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="12" cy="5" r="4" fill="#FF4D6D"/>
      <text x="22" y="1" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">MEDININAGAR HQ</text>
      <text x="22" y="14" font-family="system-ui, monospace" font-size="8.5" font-weight="600" fill="#A1A1AA">PIN: 822101 &bull; JHARKHAND</text>
    </g>
  </g>

  <!-- HUD Overlay: Compass Rose & Coordinate Metadata Badge -->
  <g id="hud-elements">
    <!-- Compass Rose (Top Right) -->
    <g transform="translate(940, 60)" filter="url(#soft-shadow)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <!-- North Pointer (Red) -->
      <polygon points="0,-19 5,-3 0,0" fill="#EF4444"/>
      <!-- South Pointer (Slate) -->
      <polygon points="0,19 5,3 0,0" fill="#94A3B8"/>
      <!-- West/East Pointers -->
      <polygon points="0,0 -3,-5 -19,0" fill="#CBD5E1"/>
      <polygon points="0,0 3,-5 19,0" fill="#CBD5E1"/>
      <polygon points="0,-19 -5,-3 0,0" fill="#DC2626"/>
      <polygon points="0,19 -5,3 0,0" fill="#64748B"/>
      <!-- Cardinal Letter N -->
      <text x="0" y="-23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#DC2626">N</text>
    </g>

    <!-- Coordinates Badge (Bottom Left) -->
    <g transform="translate(30, 605)" filter="url(#soft-shadow)">
      <rect class="badge-bg" x="0" y="-18" width="225" height="36" rx="10"/>
      <!-- Satellite / Target Icon -->
      <circle cx="18" cy="0" r="7" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="18" cy="0" r="2.5" fill="#2563EB"/>
      <text x="34" y="-3" font-family="system-ui, monospace" font-size="10" font-weight="700" fill="#18181B">24.0416° N, 84.0700° E</text>
      <text x="34" y="9" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#71717A">MEDININAGAR (DALTONGANJ)</text>
    </g>

    <!-- Graphic Scale Bar (Bottom Right) -->
    <g transform="translate(800, 615)" filter="url(#soft-shadow)">
      <rect class="badge-bg" x="-10" y="-18" width="175" height="28" rx="8"/>
      <line x1="10" y1="0" x2="150" y2="0" stroke="#18181B" stroke-width="2"/>
      <line x1="10" y1="-4" x2="10" y2="4" stroke="#18181B" stroke-width="2"/>
      <line x1="80" y1="-3" x2="80" y2="3" stroke="#18181B" stroke-width="1.5"/>
      <line x1="150" y1="-4" x2="150" y2="4" stroke="#18181B" stroke-width="2"/>
      <text x="10" y="-6" text-anchor="middle" font-family="system-ui, monospace" font-size="8" font-weight="700" fill="#71717A">0</text>
      <text x="80" y="-6" text-anchor="middle" font-family="system-ui, monospace" font-size="8" font-weight="700" fill="#71717A">1 km</text>
      <text x="150" y="-6" text-anchor="middle" font-family="system-ui, monospace" font-size="8" font-weight="700" fill="#71717A">2 km</text>
    </g>
  </g>

  <!-- Technical Corner Marks -->
  <g stroke="#CBD5E1" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 12 24 L 12 12 L 24 12"/>
    <path d="M 988 24 L 988 12 L 976 12"/>
    <path d="M 12 626 L 12 638 L 24 638"/>
    <path d="M 988 626 L 988 638 L 976 638"/>
  </g>
</svg>
